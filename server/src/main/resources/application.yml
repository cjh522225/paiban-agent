server:
  port: 8080
  # port: 8081 # 服务器端口(如需修改)
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地数据库配置
    url: jdbc:mysql://localhost:3306/paiban_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:change-me}
    
    # 服务器数据库配置

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    data:
      redis:
        host: 127.0.0.1
        port: 6379
        timeout: 3000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 4
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.Firefire.paiban.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: 86400000

# 附件上传目录（固定路径，避免因启动目录不同导致文件位置漂移）
# 部署到服务器时改为绝对路径，如 /opt/paiban/uploads
upload:
  dir: uploads

logging:
  level:
    org.redisson: WARN
